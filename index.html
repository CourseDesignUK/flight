<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UK Civil Airport 3D Flight Tracker</title>

  <link href="https://cesium.com/downloads/cesiumjs/releases/1.124/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.124/Build/Cesium/Cesium.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #cesiumContainer {
      width: 100%; height: 100%; overflow: hidden; background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      color: #fff;
    }

    .cesium-widget-credits,
    .cesium-credit-logoContainer,
    .cesium-credit-textContainer,
    .cesium-credit-expand-link,
    .cesium-viewer-timelineContainer,
    .cesium-viewer-animationContainer,
    .cesium-viewer-navigationContainer,
    .cesium-navigationHelpButton,
    .cesium-sceneModePicker-wrapper,
    .cesium-baseLayerPicker-wrapper {
      display: none !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }

    /* Splash Screen Video Overlay */
    #splash-container {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #000;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.8s ease;
    }
    #splash-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #btn-skip-intro {
      position: absolute;
      bottom: 30px;
      right: 30px;
      z-index: 1001;
      background: rgba(15, 23, 42, 0.6);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.4);
      padding: 8px 18px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
      letter-spacing: 0.5px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    /* Shared Glassmorphism Profile */
    .glass-panel {
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.45),
                  inset 0 1px 0 0 rgba(255, 255, 255, 0.12);
    }

    /* Consolidated Bottom Menu Bar */
    #bottom-menu-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 58px;
      border-radius: 0;
      border-top: 1px solid rgba(255, 255, 255, 0.18);
      border-bottom: none;
      border-left: none;
      border-right: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 100;
    }

    .bar-section {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .bar-divider {
      width: 1px;
      height: 24px;
      background: rgba(255, 255, 255, 0.18);
      margin: 0 4px;
    }

    select {
      background: rgba(30, 41, 59, 0.65);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.35);
      padding: 6px 10px;
      border-radius: 5px;
      font-weight: 600;
      cursor: pointer;
      font-size: 12px;
      outline: none;
      height: 32px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    button {
      background: rgba(30, 41, 59, 0.65);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.35);
      padding: 6px 12px;
      border-radius: 5px;
      font-weight: 600;
      cursor: pointer;
      font-size: 12px;
      height: 32px;
      white-space: nowrap;
      transition: background 0.15s ease, border-color 0.15s ease;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    button:hover:not(:disabled) { background: rgba(3, 105, 161, 0.7); color: #fff; border-color: #38bdf8; }
    button.active { background: rgba(2, 132, 199, 0.85); color: #fff; border-color: #38bdf8; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-danger { background: rgba(127, 29, 29, 0.65); border-color: rgba(239, 68, 68, 0.5); color: #fca5a5; }
    .btn-danger:hover:not(:disabled) { background: rgba(153, 27, 27, 0.85); color: #fff; }
    .btn-warning { background: rgba(120, 53, 15, 0.65); border-color: rgba(245, 158, 11, 0.5); color: #fcd34d; }
    .btn-warning:hover:not(:disabled) { background: rgba(146, 64, 14, 0.85); color: #fff; }

    /* Telemetry HUD & Comms Transcripts */
    .overlay-panel {
      position: absolute;
      border-radius: 8px;
      padding: 12px 16px;
      z-index: 95;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    #hud-telemetry { top: 20px; left: 20px; width: 310px; }
    #hud-comms {
      bottom: 74px;
      left: 20px;
      width: 480px;
      height: 140px;
      display: flex;
      flex-direction: column;
    }

    .hud-title-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      padding-bottom: 4px;
      margin-bottom: 8px;
    }

    .hud-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #38bdf8;
      font-weight: 700;
    }

    .hud-close-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 16px;
      line-height: 1;
      height: auto;
      padding: 0 2px;
      cursor: pointer;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }
    .hud-close-btn:hover {
      color: #ef4444;
      background: transparent;
    }

    .data-row { display: flex; justify-content: space-between; margin: 4px 0; font-size: 12.5px; }
    .data-label { color: #94a3b8; }
    .data-val { font-weight: 600; font-family: monospace; color: #f8fafc; }

    #comms-log {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-family: monospace;
      font-size: 11.5px;
      line-height: 1.35;
      padding-right: 4px;
      scroll-behavior: smooth;
    }
    .comm-line { display: flex; gap: 6px; word-break: break-word; }
    .comm-time { color: #64748b; flex-shrink: 0; }
    .comm-sender-atc { color: #38bdf8; font-weight: 700; flex-shrink: 0; }
    .comm-sender-pilot { color: #4ade80; font-weight: 700; flex-shrink: 0; }
    .comm-text { color: #f1f5f9; }

    #cockpit-hud-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      display: none;
      z-index: 90;
    }
    .hud-reticle-svg {
      width: 100%; height: 100%;
      stroke: #00ff66; fill: none; stroke-width: 1.5;
      font-family: monospace; font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="splash-container">
    <video id="splash-video" playsinline preload="auto">
      <source src="intro.mp4" type="video/mp4" />
    </video>
    <button id="btn-skip-intro">Skip Intro</button>
  </div>

  <div id="cesiumContainer"></div>

  <div id="cockpit-hud-overlay">
    <svg class="hud-reticle-svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice">
      <defs>
        <filter id="hud-glow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#00ff66" />
        </filter>
      </defs>
      <g filter="url(#hud-glow)">
        <path d="M 485 500 L 495 500 M 505 500 L 515 500 M 500 485 L 500 495 M 500 505 L 500 515" />
        <circle cx="500" cy="500" r="3" />
        <circle cx="500" cy="500" r="10" />
        <line x1="490" y1="500" x2="475" y2="500" />
        <line x1="510" y1="500" x2="525" y2="500" />
        <line x1="500" y1="490" x2="500" y2="475" />
        <line x1="360" y1="500" x2="440" y2="500" stroke-dasharray="8 4" />
        <line x1="560" y1="500" x2="640" y2="500" stroke-dasharray="8 4" />
        <path d="M 410 440 L 440 440 L 440 448 M 590 440 L 560 440 L 560 448" />
        <text x="390" y="444" fill="#00ff66" stroke="none">+5</text>
        <text x="600" y="444" fill="#00ff66" stroke="none">+5</text>
        <path d="M 410 560 L 440 560 L 440 552 M 590 560 L 560 560 L 560 552" stroke-dasharray="6 3" />
        <text x="390" y="564" fill="#00ff66" stroke="none">-5</text>
        <text x="600" y="564" fill="#00ff66" stroke="none">-5</text>
        <rect x="380" y="70" width="240" height="28" stroke="#00ff66" />
        <polygon points="500,103 495,110 505,110" fill="#00ff66" />
        <text id="hud-cockpit-hdg" x="500" y="90" text-anchor="middle" fill="#00ff66" stroke="none" font-weight="bold" font-size="14">HDG: ---°</text>
        <rect x="230" y="380" width="80" height="240" stroke="#00ff66" />
        <text x="270" y="405" text-anchor="middle" fill="#00ff66" stroke="none">GS KTS</text>
        <text id="hud-cockpit-spd" x="270" y="505" text-anchor="middle" fill="#00ff66" stroke="none" font-size="20" font-weight="bold">---</text>
        <rect x="690" y="380" width="90" height="240" stroke="#00ff66" />
        <text x="735" y="405" text-anchor="middle" fill="#00ff66" stroke="none">ALT FT</text>
        <text id="hud-cockpit-alt" x="735" y="505" text-anchor="middle" fill="#00ff66" stroke="none" font-size="20" font-weight="bold">---</text>
      </g>
    </svg>
  </div>

  <div id="hud-telemetry" class="overlay-panel glass-panel">
    <div class="hud-title-bar">
      <span class="hud-title" id="hud-station-title">Airport Telemetry</span>
      <button class="hud-close-btn" id="btn-close-telemetry" title="Close Telemetry Panel">&times;</button>
    </div>
    <div class="data-row"><span class="data-label">Callsign:</span><span class="data-val">SPEEDBIRD 3</span></div>
    <div class="data-row"><span class="data-label">Phase:</span><span class="data-val" id="hud-approach">6-mile Final</span></div>
    <div class="data-row"><span class="data-label">Altitude:</span><span class="data-val" id="hud-alt">-- ft</span></div>
    <div class="data-row"><span class="data-label">Ground Speed:</span><span class="data-val" id="hud-speed">-- kts</span></div>
    <div class="data-row"><span class="data-label">Threshold Dist:</span><span class="data-val" id="hud-dist">-- NM</span></div>
    <div class="data-row"><span class="data-label">Coordinates:</span><span class="data-val" id="hud-coords">-- , --</span></div>
  </div>

  <div id="hud-comms" class="overlay-panel glass-panel">
    <div class="hud-title-bar">
      <div style="display:flex; align-items:center; gap:8px;">
        <span class="hud-title" id="comms-title">VHF COM: APPROACH</span>
        <span style="color:#22c55e; font-size:10px; font-weight:700;">LIVE</span>
      </div>
      <button class="hud-close-btn" id="btn-close-comms" title="Close Comms Panel">&times;</button>
    </div>
    <div id="comms-log"></div>
  </div>

  <div id="bottom-menu-bar" class="glass-panel">
    <div class="bar-section">
      <select id="airfieldSelect" title="Select Airfield"></select>
    </div>

    <div class="bar-divider"></div>

    <div class="bar-section">
      <button id="btn-playpause">Pause</button>
      <button id="btn-chase" class="active">Chase</button>
      <button id="btn-cockpit">Cockpit</button>
      <button id="btn-tower">Tower</button>
      <button id="btn-free">Free</button>
    </div>

    <div class="bar-divider"></div>

    <div class="bar-section">
      <button id="btn-toggle-telemetry" class="active" title="Toggle Telemetry Overlay">Telemetry</button>
      <button id="btn-toggle-comms" class="active" title="Toggle Comms Overlay">Dialogue</button>
      <button id="btn-em-fire" class="btn-danger">Engine Fire</button>
      <button id="btn-em-fumes" class="btn-danger">Cockpit Fumes</button>
      <button id="btn-em-gear" class="btn-warning">Stuck Gear</button>
    </div>
  </div>

  <script>
    const splash = document.getElementById("splash-container");
    const splashVideo = document.getElementById("splash-video");
    const btnSkipIntro = document.getElementById("btn-skip-intro");

    function dismissSplash() {
      if (splash.style.display === "none") return;
      splash.style.opacity = "0";
      setTimeout(() => {
        splashVideo.pause();
        splash.style.display = "none";
      }, 800);
    }

    splashVideo.addEventListener("ended", dismissSplash);
    btnSkipIntro.addEventListener("click", dismissSplash);
    splashVideo.play().catch(() => {});

    const panelTelemetry = document.getElementById("hud-telemetry");
    const panelComms = document.getElementById("hud-comms");
    const btnToggleTelemetry = document.getElementById("btn-toggle-telemetry");
    const btnToggleComms = document.getElementById("btn-toggle-comms");
    const btnCloseTelemetry = document.getElementById("btn-close-telemetry");
    const btnCloseComms = document.getElementById("btn-close-comms");

    function setPanelVisible(panel, toggleBtn, visible) {
      panel.style.display = visible ? (panel.id === "hud-comms" ? "flex" : "block") : "none";
      if (visible) {
        toggleBtn.classList.add("active");
      } else {
        toggleBtn.classList.remove("active");
      }
    }

    btnCloseTelemetry.addEventListener("click", () => setPanelVisible(panelTelemetry, btnToggleTelemetry, false));
    btnCloseComms.addEventListener("click", () => setPanelVisible(panelComms, btnToggleComms, false));

    btnToggleTelemetry.addEventListener("click", () => {
      const isVisible = panelTelemetry.style.display !== "none";
      setPanelVisible(panelTelemetry, btnToggleTelemetry, !isVisible);
    });

    btnToggleComms.addEventListener("click", () => {
      const isVisible = panelComms.style.display !== "none";
      setPanelVisible(panelComms, btnToggleComms, !isVisible);
    });

    const viewer = new Cesium.Viewer("cesiumContainer", {
      baseLayer: new Cesium.ImageryLayer(
        new Cesium.UrlTemplateImageryProvider({
          url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
          maximumLevel: 19
        })
      ),
      baseLayerPicker: false,
      geocoder: false,
      homeButton: false,
      sceneModePicker: false,
      infoBox: false,
      selectionIndicator: false,
      navigationHelpButton: false,
      animation: false,
      timeline: false,
      shouldAnimate: true,
      creditContainer: document.createElement("div")
    });

    viewer.scene.globe.enableLighting = false;
    viewer.scene.highDynamicRange = false;

    const airports = {
      egll: { name: "London Heathrow",       icao: "EGLL", thrLat: 51.4776, thrLon: -0.4332, heading: 270, rwy: "27R", atcName: "Heathrow Director", twrName: "Heathrow Tower", altMeters: 25, appFreq: "119.725", twrFreq: "118.500" },
      egkk: { name: "London Gatwick",        icao: "EGKK", thrLat: 51.1565, thrLon: -0.1607, heading: 260, rwy: "26L", atcName: "Gatwick Director",  twrName: "Gatwick Tower",  altMeters: 62, appFreq: "126.825", twrFreq: "124.225" },
      egss: { name: "London Stansted",       icao: "EGSS", thrLat: 51.8953, thrLon:  0.2541, heading: 224, rwy: "22",  atcName: "Stansted Radar",    twrName: "Stansted Tower", altMeters: 106, appFreq: "120.625", twrFreq: "123.800" },
      eggw: { name: "London Luton",          icao: "EGGW", thrLat: 51.8767, thrLon: -0.3524, heading: 257, rwy: "26",  atcName: "Luton Radar",       twrName: "Luton Tower",    altMeters: 160, appFreq: "129.550", twrFreq: "132.550" },
      eglc: { name: "London City",           icao: "EGLC", thrLat: 51.5050, thrLon:  0.0645, heading: 273, rwy: "27",  atcName: "Thames Radar",      twrName: "City Tower",     altMeters: 6,   appFreq: "132.700", twrFreq: "118.075" },
      egcc: { name: "Manchester",            icao: "EGCC", thrLat: 53.3638, thrLon: -2.2570, heading: 232, rwy: "23R", atcName: "Manchester Radar", twrName: "Manchester Tower",altMeters: 78, appFreq: "118.575", twrFreq: "118.625" },
      egbb: { name: "Birmingham",            icao: "EGBB", thrLat: 52.4439, thrLon: -1.7375, heading: 331, rwy: "33",  atcName: "Birmingham Radar", twrName: "Birmingham Tower",altMeters: 100, appFreq: "131.000", twrFreq: "118.300" },
      egph: { name: "Edinburgh",             icao: "EGPH", thrLat: 55.9550, thrLon: -3.3512, heading: 236, rwy: "24",  atcName: "Edinburgh Radar",  twrName: "Edinburgh Tower",altMeters: 41, appFreq: "121.200", twrFreq: "118.700" },
      egpf: { name: "Glasgow",               icao: "EGPF", thrLat: 55.8772, thrLon: -4.4172, heading: 230, rwy: "23",  atcName: "Glasgow Radar",    twrName: "Glasgow Tower",  altMeters: 8,   appFreq: "119.100", twrFreq: "118.800" },
      eggd: { name: "Bristol",               icao: "EGGD", thrLat: 51.3828, thrLon: -2.7042, heading: 268, rwy: "27",  atcName: "Bristol Radar",    twrName: "Bristol Tower",  altMeters: 190, appFreq: "125.650", twrFreq: "133.850" },
      egnt: { name: "Newcastle",             icao: "EGNT", thrLat: 55.0422, thrLon: -1.6760, heading: 252, rwy: "25",  atcName: "Newcastle Radar",  twrName: "Newcastle Tower",altMeters: 81, appFreq: "124.375", twrFreq: "119.700" },
      eggp: { name: "Liverpool John Lennon", icao: "EGGP", thrLat: 53.3338, thrLon: -2.8335, heading: 268, rwy: "27",  atcName: "Liverpool Radar",  twrName: "Liverpool Tower",altMeters: 25, appFreq: "119.850", twrFreq: "126.350" },
      egnm: { name: "Leeds Bradford",        icao: "EGNM", thrLat: 53.8614, thrLon: -1.6517, heading: 320, rwy: "32",  atcName: "Leeds Radar",      twrName: "Leeds Tower",    altMeters: 208, appFreq: "134.575", twrFreq: "120.300" },
      egnx: { name: "East Midlands",         icao: "EGNX", thrLat: 52.8315, thrLon: -1.3090, heading: 270, rwy: "27",  atcName: "East Midlands Radar", twrName: "Tower",       altMeters: 93,  appFreq: "134.175", twrFreq: "124.000" },
      egaa: { name: "Belfast International", icao: "EGAA", thrLat: 54.6628, thrLon: -6.1970, heading: 247, rwy: "25",  atcName: "Belfast Radar",    twrName: "Aldergrove Tower",altMeters: 82, appFreq: "128.500", twrFreq: "118.300" },
      egac: { name: "George Best Belfast City",icao: "EGAC", thrLat: 54.6225, thrLon: -5.8640, heading: 221, rwy: "22", atcName: "City Approach",  twrName: "City Tower",     altMeters: 5,   appFreq: "130.850", twrFreq: "122.825" },
      egpd: { name: "Aberdeen",              icao: "EGPD", thrLat: 57.1942, thrLon: -2.1930, heading: 341, rwy: "34",  atcName: "Aberdeen Radar",   twrName: "Aberdeen Tower", altMeters: 66, appFreq: "119.050", twrFreq: "118.100" },
      egff: { name: "Cardiff",               icao: "EGFF", thrLat: 51.3932, thrLon: -3.3280, heading: 300, rwy: "30",  atcName: "Cardiff Radar",    twrName: "Cardiff Tower",  altMeters: 67, appFreq: "119.150", twrFreq: "133.100" },
      egte: { name: "Exeter",                icao: "EGTE", thrLat: 50.7360, thrLon: -3.3985, heading: 257, rwy: "26",  atcName: "Exeter Approach",  twrName: "Exeter Tower",   altMeters: 31, appFreq: "128.975", twrFreq: "119.800" },
      eghi: { name: "Southampton",           icao: "EGHI", thrLat: 50.9575, thrLon: -1.3525, heading: 202, rwy: "20",  atcName: "Southampton Radar",twrName: "Tower",          altMeters: 13, appFreq: "122.725", twrFreq: "118.200" },
      eghh: { name: "Bournemouth",           icao: "EGHH", thrLat: 50.7818, thrLon: -1.8285, heading: 257, rwy: "26",  atcName: "Bournemouth Radar",twrName: "Tower",          altMeters: 12, appFreq: "119.475", twrFreq: "125.600" },
      egsh: { name: "Norwich",               icao: "EGSH", thrLat: 52.6761, thrLon:  1.2965, heading: 268, rwy: "27",  atcName: "Norwich Radar",    twrName: "Norwich Tower",  altMeters: 36, appFreq: "119.350", twrFreq: "124.250" },
      egpe: { name: "Inverness",             icao: "EGPE", thrLat: 57.5450, thrLon: -4.0325, heading: 231, rwy: "23",  atcName: "Inverness Approach",twrName: "Tower",         altMeters: 9,   appFreq: "122.600", twrFreq: "118.400" },
      egsc: { name: "Cambridge City",        icao: "EGSC", thrLat: 52.2095, thrLon:  0.1870, heading: 231, rwy: "23",  atcName: "Cambridge Approach",twrName: "Tower",         altMeters: 15, appFreq: "120.900", twrFreq: "125.900" },
      egns: { name: "Isle of Man (Ronaldsway)", icao: "EGNS", thrLat: 54.0850, thrLon: -4.6105, heading: 258, rwy: "26", atcName: "Isle of Man Approach", twrName: "Tower",    altMeters: 16, appFreq: "135.900", twrFreq: "118.900" },
      egjb: { name: "Guernsey",              icao: "EGJB", thrLat: 49.4352, thrLon: -2.5895, heading: 268, rwy: "27",  atcName: "Guernsey Approach",twrName: "Guernsey Tower", altMeters: 102, appFreq: "128.650", twrFreq: "119.950" },
      egjj: { name: "Jersey",                icao: "EGJJ", thrLat: 49.2078, thrLon: -2.1800, heading: 261, rwy: "26",  atcName: "Jersey Approach",  twrName: "Jersey Tower",   altMeters: 84, appFreq: "120.450", twrFreq: "119.450" }
    };

    const engineFireSystem = viewer.scene.primitives.add(new Cesium.ParticleSystem({
      image: 'https://sandcastle.cesium.com/SampleData/fire.png',
      startColor: Cesium.Color.RED.withAlpha(0.9),
      endColor: Cesium.Color.YELLOW.withAlpha(0.1),
      startScale: 1.0, endScale: 4.0,
      minimumParticleLife: 0.5, maximumParticleLife: 1.2,
      minimumSpeed: 8.0, maximumSpeed: 14.0,

    function unlockAudio() {

    function dispatchComm(comm, timeMins, timeSecs) {
      const phoneticText = comm.text
        .replace(/PAN-PAN,\s*PAN-PAN,\s*PAN-PAN/gi, "Pan Pan, Pan Pan, Pan Pan")
        .replace(/Runway (\d)(\d)([a-zA-Z]?)/gi, (match, d1, d2, lr) => {
          let spoken = "Runway " + d1 + " " + d2;
          if (lr && lr.toUpperCase() === 'L') spoken += " Left";
          else if (lr && lr.toUpperCase() === 'R') spoken += " Right";
          return spoken;
        })
        .replace(/QNH/gi, "Q-N-H")
        .replace(/ILS/gi, "I-L-S")
        .replace(/DME/gi, "D-M-E")
        .replace(/BAW3/gi, "Speedbird 3")
        .replace(/1013/gi, "1 0 1 3")
        .replace(/1014/gi, "1 0 1 4")
        .replace(/(\d{3})\.(\d+)/g, (match, p1, p2) => {
          let decimalPart = p2.replace(/0+$/, '');
          if (!decimalPart) decimalPart = '0';
          return p1.split('').join(' ') + ' decimal ' + decimalPart.split('').join(' ');
        });

      function updateUI() {
        const commsTitle = document.getElementById("comms-title");
        const commsLog = document.getElementById("comms-log");
        
        commsTitle.textContent = `${comm.label.toUpperCase()} (${comm.freq} MHz)`;
        const line = document.createElement("div");
        line.className = "comm-line";
        const senderClass = comm.sender === "atc" ? "comm-sender-atc" : "comm-sender-pilot";
        const senderLabel = comm.sender === "atc" ? "ATC:" : "BAW3:";
        
        line.innerHTML = `<span class="comm-time">[+${timeMins}:${timeSecs}]</span><span class="${senderClass}">${senderLabel}</span><span class="comm-text">${comm.text}</span>`;
        commsLog.appendChild(line);
        commsLog.scrollTop = commsLog.scrollHeight;
      }

      if (!("speechSynthesis" in window) || !window.speechSynthesis) {
        updateUI();
        return;
      }

      const utterance = new SpeechSynthesisUtterance(phoneticText);
      utterance.lang = "en-GB";

      if (comm.sender === "atc") {
        utterance.pitch = 0.85;
        utterance.rate = 1.05;
        const atcVoice = voices.find(v => v.lang.includes("en") && (v.name.includes("Male") || v.name.includes("George") || v.name.includes("Oliver") || v.name.includes("David")));
        if (atcVoice) utterance.voice = atcVoice;
      } else {
        utterance.pitch = 1.25;
        utterance.rate = 1.05;
        const pilotVoice = voices.find(v => v.lang.includes("en") && (
          v.name.includes("Female") || v.name.includes("Samantha") || v.name.includes("Victoria") ||
          v.name.includes("Zira") || v.name.includes("Hazel") || v.name.includes("Susan") ||
          v.name.includes("Karen") || v.name.includes("Catherine")
        ));
        if (pilotVoice) utterance.voice = pilotVoice;
      }

      utterance.onstart = updateUI;
      utterance.onerror = updateUI;
      window.speechSynthesis.speak(utterance);
    }

    const startTime = Cesium.JulianDate.fromIso8601("2026-06-21T12:00:00Z");
    const duration = 180;
    const stopTime = Cesium.JulianDate.addSeconds(startTime, duration, new Cesium.JulianDate());

    viewer.clock.startTime = startTime.clone();
    viewer.clock.stopTime = stopTime.clone();
    viewer.clock.currentTime = startTime.clone();
    viewer.clock.clockRange = Cesium.ClockRange.LOOP_STOP;
    viewer.clock.multiplier = 1.0;

    function calculateDestination(lat, lon, bearingDeg, distanceMeters) {
      const R = 6371000;
      const rad = Math.PI / 180;
      const rLat = lat * rad;
      const rLon = lon * rad;
      const rBearing = bearingDeg * rad;
      const dR = distanceMeters / R;
      const nLat = Math.asin(Math.sin(rLat) * Math.cos(dR) + Math.cos(rLat) * Math.sin(dR) * Math.cos(rBearing));
      const nLon = rLon + Math.atan2(Math.sin(rBearing) * Math.sin(dR) * Math.cos(rLat), Math.cos(dR) - Math.sin(rLat) * Math.sin(nLat));
      return { lat: nLat / rad, lon: nLon / rad };
    }

    function generateNormalDialogue(ap) {
      const fieldElevationFt = ap.altMeters * 3.28084;
      const assignedAltFt = Math.round((3000 + fieldElevationFt) / 100) * 100;
      const intAltFt = Math.round((2200 + fieldElevationFt) / 100) * 100;

      return [
        { s: 2, phase: "6-mile Final", sender: "atc", freq: ap.appFreq, label: ap.atcName, text: `Speedbird 3, ${ap.atcName}, radar contact 6 miles straight-in. Descend to altitude ${assignedAltFt} feet on QNH 1013.` },
        { s: 10, phase: "6-mile Final", sender: "pilot", freq: ap.appFreq, label: "BAW3", text: `Descend ${assignedAltFt} feet on 1013, cleared ILS Runway ${ap.rwy}, Speedbird 3.` },
        { s: 25, phase: "Glidepath Intercept", sender: "pilot", freq: ap.appFreq, label: "BAW3", text: `Speedbird 3 descending through ${intAltFt} feet, localiser captured, glide slope alive.` },
        { s: 32, phase: "Glidepath Intercept", sender: "atc", freq: ap.appFreq, label: ap.atcName, text: `Speedbird 3, roger. Maintain 150 knots to 4 DME. Contact ${ap.twrName} on ${ap.twrFreq}.` },
        { s: 40, phase: "Glidepath Intercept", sender: "pilot", freq: ap.twrFreq, label: "BAW3", text: `150 to 4, over to Tower on ${ap.twrFreq}, good day. Speedbird 3.` },
        { s: 55, phase: "Established 4 DME", sender: "pilot", freq: ap.twrFreq, label: "BAW3", text: `${ap.twrName}, Speedbird 3 fully established Runway ${ap.rwy}, 4 miles out.` },
        { s: 62, phase: "Established 4 DME", sender: "atc", freq: ap.twrFreq, label: ap.twrName, text: `Speedbird 3, ${ap.twrName}, welcome. Continue approach Runway ${ap.rwy}, wind ${ap.heading - 10} degrees at 8 knots.` },
        { s: 80, phase: "Short Final 2 DME", sender: "pilot", freq: ap.twrFreq, label: "BAW3", text: `Speedbird 3, 2 miles, gear down and locked, flaps full, landing checks complete.` },
        { s: 88, phase: "Short Final 2 DME", sender: "atc", freq: ap.twrFreq, label: ap.twrName, text: `Speedbird 3, wind ${(ap.heading + 5) % 360} degrees at 9 knots, Runway ${ap.rwy} cleared to land.` },
        { s: 96, phase: "Short Final 2 DME", sender: "pilot", freq: ap.twrFreq, label: "BAW3", text: `Cleared to land Runway ${ap.rwy}, Speedbird 3.` },
        { s: 111, phase: "Threshold Crossing", sender: "pilot", freq: ap.twrFreq, label: "BAW3", text: `Passing threshold, 50... 30... 10... Retard.` },
        { s: 118, phase: "Touchdown & Rollout", sender: "pilot", freq: ap.twrFreq, label: "BAW3", text: `Touchdown on centerline, thrust reverse normal, braking.` },
        { s: 145, phase: "Rollout Deceleration", sender: "pilot", freq: ap.twrFreq, label: "BAW3", text: `Decelerating through 50 knots, reversers stowed.` },
        { s: 160, phase: "Full Stop", sender: "pilot", freq: ap.twrFreq, label: "BAW3", text: `Speedbird 3 brought to a complete halt on the runway centerline.` }
      ];
    }

    function loadAirport(key) {
      if (window.speechSynthesis) {
        window.speechSynthesis.cancel();
      }

      activeEmergency = 'none';
      currentAirportKey = key;
      const ap = airports[key];
      document.getElementById("hud-station-title").textContent = `${ap.name} Telemetry`;

      viewer.clock.currentTime = startTime.clone();
      radioScript = generateNormalDialogue(ap);
      displayedCommIndices.clear();
      document.getElementById("comms-log").innerHTML = "";

      const reciprocalHeading = (ap.heading + 180) % 360;
      const visualGroundZ = 2.0;

      const rawWaypoints = [
        { s: 0,   dist: 11075, z: visualGroundZ + 580 },
        { s: 30,  dist: 7535,  z: visualGroundZ + 387 },
        { s: 60,  dist: 4535,  z: visualGroundZ + 231 },
        { s: 90,  dist: 1925,  z: visualGroundZ + 97 },
        { s: 110, dist: 385,   z: visualGroundZ + 25 },
        { s: 114, dist: 0,     z: visualGroundZ + 15 },
        { s: 118, dist: -300,  z: visualGroundZ },
        { s: 130, dist: -750,  z: visualGroundZ },
        { s: 145, dist: -1100, z: visualGroundZ },
        { s: 160, dist: -1300, z: visualGroundZ },
        { s: 180, dist: -1300, z: visualGroundZ }
      ];

      const waypoints = rawWaypoints.map(wp => {
        const bearing = wp.dist >= 0 ? reciprocalHeading : ap.heading;
        const coords = calculateDestination(ap.thrLat, ap.thrLon, bearing, Math.abs(wp.dist));
        return { s: wp.s, lon: coords.lon, lat: coords.lat, z: wp.z };
      });

      positionProperty = new Cesium.SampledPositionProperty();
      positionProperty.setInterpolationOptions({
        interpolationDegree: 1,
        interpolationAlgorithm: Cesium.LinearApproximation
      });

      waypoints.forEach(wp => {
        const time = Cesium.JulianDate.addSeconds(startTime, wp.s, new Cesium.JulianDate());
        const pos = Cesium.Cartesian3.fromDegrees(wp.lon, wp.lat, wp.z);
        positionProperty.addSample(time, pos);
      });

      if (aircraftEntity) {
        viewer.entities.remove(aircraftEntity);
      }

      aircraftEntity = viewer.entities.add({
        availability: new Cesium.TimeIntervalCollection([
          new Cesium.TimeInterval({ start: startTime, stop: stopTime })
        ]),
        position: positionProperty,
        orientation: new Cesium.VelocityOrientationProperty(positionProperty),
        model: {
          uri: "https://raw.githubusercontent.com/CesiumGS/cesium/main/Apps/SampleData/models/CesiumAir/Cesium_Air.glb",
          minimumPixelSize: 64,
          maximumScale: 1000
        },
        path: {
          resolution: 1,
          material: new Cesium.PolylineGlowMaterialProperty({
            glowPower: 0.25,
            color: Cesium.Color.fromCssColorString("#38bdf8")
          }),
          width: 3,
          leadTime: 0,
          trailTime: 120
        }
      });

      if (cameraMode === "chase") {
        viewer.trackedEntity = aircraftEntity;
      } else if (cameraMode === "tower") {
        setTowerCamera();
      }
    }

    function setTowerCamera() {
      const ap = airports[currentAirportKey];
      const towerPos = calculateDestination(ap.thrLat, ap.thrLon, (ap.heading + 90) % 360, 300);
      viewer.camera.flyTo({
        destination: Cesium.Cartesian3.fromDegrees(towerPos.lon, towerPos.lat, 100),
        orientation: {
          heading: Cesium.Math.toRadians((ap.heading + 180) % 360),
          pitch: Cesium.Math.toRadians(-5),
          roll: 0
        },
        duration: 1.0
      });
    }

    function triggerEmergency(type) {
      if (activeEmergency !== 'none') return;
      activeEmergency = type;
      
      const currentTime = viewer.clock.currentTime;
      const elapsedSec = Cesium.JulianDate.secondsDifference(currentTime, startTime);
      const ap = airports[currentAirportKey];

      radioScript = radioScript.filter(comm => comm.s <= elapsedSec);
      if (window.speechSynthesis) window.speechSynthesis.cancel(); 

      const injectTime = Math.max(Math.floor(elapsedSec) + 1, 10);

      if (type === 'fire') {
        radioScript.push({ s: injectTime, phase: "Emergency Declared", sender: "pilot", freq: ap.appFreq, label: "BAW3", text: `MAYDAY, MAYDAY, MAYDAY, Speedbird 3, engine fire number two, severe loss of power. Priority landing Runway ${ap.rwy}.` });
        radioScript.push({ s: injectTime + 9, phase: "Emergency Declared", sender: "atc", freq: ap.appFreq, label: ap.atcName, text: `Speedbird 3, MAYDAY acknowledged. Number one for Runway ${ap.rwy}, cleared to land. Fire rescue dispatched.` });
        radioScript.push({ s: injectTime + 18, phase: "Emergency Declared", sender: "pilot", freq: ap.appFreq, label: "BAW3", text: `Cleared to land Runway ${ap.rwy}, Speedbird 3. Fire bottle discharged.` });
        radioScript.push({ s: 118, phase: "Touchdown & Rollout", sender: "pilot", freq: ap.appFreq, label: "BAW3", text: `Touchdown on centerline, maximum reverse and heavy braking.` });
        radioScript.push({ s: 160, phase: "Evacuation", sender: "pilot", freq: ap.appFreq, label: "BAW3", text: `Speedbird 3 is stopped on centerline. Commencing immediate evacuation.` });
      } else if (type === 'fumes') {
        radioScript.push({ s: injectTime, phase: "Emergency Declared", sender: "pilot", freq: ap.appFreq, label: "BAW3", text: `MAYDAY, MAYDAY, MAYDAY, Speedbird 3, cockpit fumes detected. Donning smoke goggles and oxygen.` });
        radioScript.push({ s: injectTime + 9, phase: "Emergency Declared", sender: "atc", freq: ap.appFreq, label: ap.atcName, text: `Speedbird 3, MAYDAY acknowledged. Direct to Runway ${ap.rwy}, cleared to land.` });
        radioScript.push({ s: 118, phase: "Touchdown & Rollout", sender: "pilot", freq: ap.appFreq, label: "BAW3", text: `Touchdown on centerline, aggressive braking.` });
        radioScript.push({ s: 160, phase: "Evacuation", sender: "pilot", freq: ap.appFreq, label: "BAW3", text: `Stopped on runway centerline. Ordering evacuation via emergency slides.` });
      } else if (type === 'gear') {
        radioScript.push({ s: injectTime, phase: "Urgency Declared", sender: "pilot", freq: ap.appFreq, label: "BAW3", text: `PAN-PAN, PAN-PAN, PAN-PAN, Speedbird 3, unsafe gear indication. Nose gear transit light illuminated, showing unsafe.` });
        radioScript.push({ s: injectTime + 9, phase: "Urgency Declared", sender: "atc", freq: ap.appFreq, label: ap.atcName, text: `Speedbird 3, PAN-PAN acknowledged. Emergency services alerted to local standby. Runway ${ap.rwy} cleared to land.` });
        radioScript.push({ s: 118, phase: "Touchdown & Rollout", sender: "pilot", freq: ap.appFreq, label: "BAW3", text: `Main gear touchdown on centerline. Holding nose attitude as long as possible.` });
        radioScript.push({ s: 135, phase: "Touchdown & Rollout", sender: "pilot", freq: ap.appFreq, label: "BAW3", text: `Nose down on the runway. Scraping along centerline.` });
        radioScript.push({ s: 160, phase: "Evacuation", sender: "pilot", freq: ap.appFreq, label: "BAW3", text: `Speedbird 3 brought to a complete halt on centerline. Requesting fire rescue inspect gear.` });
      }

      radioScript.sort((a, b) => a.s - b.s);
      document.getElementById("btn-em-fire").disabled = true;
      document.getElementById("btn-em-fumes").disabled = true;
      document.getElementById("btn-em-gear").disabled = true;
    }

    document.getElementById("btn-em-fire").onclick = () => triggerEmergency('fire');
    document.getElementById("btn-em-fumes").onclick = () => triggerEmergency('fumes');
    document.getElementById("btn-em-gear").onclick = () => triggerEmergency('gear');

    loadAirport("egll");

    selectElem.onchange = (e) => {
      document.getElementById("btn-em-fire").disabled = false;
      document.getElementById("btn-em-fumes").disabled = false;
      document.getElementById("btn-em-gear").disabled = false;
      loadAirport(e.target.value);
    };

    const btnPlayPause = document.getElementById("btn-playpause");
    const btnChase = document.getElementById("btn-chase");
    const btnCockpit = document.getElementById("btn-cockpit");
    const btnTower = document.getElementById("btn-tower");
    const btnFree = document.getElementById("btn-free");
    const modeButtons = [btnChase, btnCockpit, btnTower, btnFree];
    const cockpitOverlay = document.getElementById("cockpit-hud-overlay");

    btnPlayPause.onclick = () => {
      const isAnimating = viewer.clock.shouldAnimate;
      viewer.clock.shouldAnimate = !isAnimating;
      btnPlayPause.textContent = isAnimating ? "Play" : "Pause";
      
      if (window.speechSynthesis) {
        if (isAnimating) {
          window.speechSynthesis.pause();
        } else {
          window.speechSynthesis.resume();
        }
      }
    };

    function setActiveMode(newMode, activeBtn) {
      cameraMode = newMode;
      modeButtons.forEach(b => b.classList.remove("active"));
      activeBtn.classList.add("active");
      cockpitOverlay.style.display = (cameraMode === "cockpit") ? "block" : "none";

    btnChase.onclick = () => {

    };

    btnCockpit.onclick = () => {

    btnFree.onclick = () => {
      setActiveMode("free", btnFree);
      viewer.trackedEntity = undefined;
    };

    const hudAlt = document.getElementById("hud-alt");
    const hudSpeed = document.getElementById("hud-speed");
    const hudCoords = document.getElementById("hud-coords");
    const hudApproach = document.getElementById("hud-approach");
    const hudDist = document.getElementById("hud-dist");
    const hudCockpitHdg = document.getElementById("hud-cockpit-hdg");
    const hudCockpitSpd = document.getElementById("hud-cockpit-spd");
    const hudCockpitAlt = document.getElementById("hud-cockpit-alt");

    const scratchVelocity = new Cesium.Cartesian3();
    const scratchTransform = new Cesium.Matrix4();
    const mountTransform = new Cesium.Matrix4();
    const externalNoseOffset = new Cesium.Cartesian3(0.0, 12.0, 2.5);
    let lastValidVelocity = new Cesium.Cartesian3(0, 1, 0);
    const visualGroundZ = 2.0;

    viewer.scene.preRender.addEventListener(() => {
      if (!positionProperty) return;
      const currentTime = viewer.clock.currentTime;
      const currentPos = positionProperty.getValue(currentTime);
      const elapsedSec = Cesium.JulianDate.secondsDifference(currentTime, startTime);
      const ap = airports[currentAirportKey];

      if (elapsedSec < 0.5 && displayedCommIndices.size > 0) {
        displayedCommIndices.clear();
        document.getElementById("comms-log").innerHTML = "";
        if (window.speechSynthesis) window.speechSynthesis.cancel();
        activeEmergency = 'none';
        document.getElementById("btn-em-fire").disabled = false;
        document.getElementById("btn-em-fumes").disabled = false;
        document.getElementById("btn-em-gear").disabled = false;
      }

      radioScript.forEach((comm, index) => {
        if (elapsedSec >= comm.s && !displayedCommIndices.has(index)) {
          displayedCommIndices.add(index);
          const timeMins = Math.floor(comm.s / 60).toString().padStart(2, "0");
          const timeSecs = Math.floor(comm.s % 60).toString().padStart(2, "0");
          dispatchComm(comm, timeMins, timeSecs);
        }
      });

      if (activeEmergency !== 'none') {
        hudApproach.style.color = activeEmergency === 'gear' ? "#f59e0b" : "#ef4444";
        const prefix = activeEmergency === 'gear' ? "PAN-PAN" : "EMERGENCY";
        if (elapsedSec < 110) hudApproach.textContent = `${prefix} APPROACH`;
        else if (elapsedSec < 114) hudApproach.textContent = `${prefix} SHORT FINAL`;
        else if (elapsedSec < 160) hudApproach.textContent = `${prefix} ROLLOUT`;
        else hudApproach.textContent = activeEmergency === 'gear' ? "LOCAL STANDBY INSPECTION" : "EMERGENCY STOP / EVACUATION";
      } else {
        hudApproach.style.color = "#f8fafc";
        if (elapsedSec < 30) hudApproach.textContent = "6-mile Final";
        else if (elapsedSec < 60) hudApproach.textContent = "Glidepath Intercept";
        else if (elapsedSec < 85) hudApproach.textContent = "4-mile Final";
        else if (elapsedSec < 110) hudApproach.textContent = "Short Final 2 DME";
        else if (elapsedSec < 114) hudApproach.textContent = "Threshold Crossing";
        else if (elapsedSec < 160) hudApproach.textContent = "Touchdown / Centerline Rollout";
        else hudApproach.textContent = "Brought to Halt on Centerline";
      }

      if (currentPos) {
        const cartographic = Cesium.Cartographic.fromCartesian(currentPos);
        const lon = Cesium.Math.toDegrees(cartographic.longitude);
        const lat = Cesium.Math.toDegrees(cartographic.latitude);
        const altFt = Math.round((cartographic.height - visualGroundZ + ap.altMeters) * 3.28084);

        const thresholdCartesian = Cesium.Cartesian3.fromDegrees(ap.thrLon, ap.thrLat, visualGroundZ);
        const distMeters = Cesium.Cartesian3.distance(currentPos, thresholdCartesian);
        const thresholdDistNM = (elapsedSec > 114) ? -((distMeters / 1852).toFixed(2)) : (distMeters / 1852).toFixed(2);

        hudAlt.textContent = `${altFt.toLocaleString()} ft`;
        hudCoords.textContent = `${lat.toFixed(4)}°N, ${Math.abs(lon).toFixed(4)}°W`;
        hudCockpitAlt.textContent = `${altFt}`;
        hudDist.textContent = `${thresholdDistNM} NM`;

        const nextTime = Cesium.JulianDate.addSeconds(currentTime, 0.25, new Cesium.JulianDate());
        const nextPos = positionProperty.getValue(nextTime);

        if (nextPos) {
          Cesium.Cartesian3.subtract(nextPos, currentPos, scratchVelocity);
          const stepDistance = Cesium.Cartesian3.magnitude(scratchVelocity);
          
          if (stepDistance > 0.001) {
            Cesium.Cartesian3.normalize(scratchVelocity, scratchVelocity);
            Cesium.Cartesian3.clone(scratchVelocity, lastValidVelocity);
          } else {
            Cesium.Cartesian3.clone(lastValidVelocity, scratchVelocity);
          }

          let kts = Math.round((stepDistance / 0.25) * 1.94384);
          if (elapsedSec >= 160) kts = 0; 
          
          hudSpeed.textContent = `${kts} kts`;
          hudCockpitSpd.textContent = `${kts}`;

          const enuMatrix = Cesium.Transforms.eastNorthUpToFixedFrame(currentPos);
          const invEnu = Cesium.Matrix4.inverse(enuMatrix, new Cesium.Matrix4());
          const localVelocity = Cesium.Matrix4.multiplyByPointAsVector(invEnu, scratchVelocity, new Cesium.Cartesian3());
          let headingDeg = Cesium.Math.toDegrees(Math.atan2(localVelocity.x, localVelocity.y));
          if (headingDeg < 0) headingDeg += 360;
          hudCockpitHdg.textContent = `HDG: ${Math.round(headingDeg).toString().padStart(3, "0")}°`;

          engineFireSystem.show = false;
          engineSmokeSystem.show = false;
          cockpitSmokeSystem.show = false;
          gearSparkSystem.show = false;

          const rotMatrix = Cesium.Transforms.rotationMatrixFromPositionVelocity(
            currentPos,
            scratchVelocity,
            Cesium.Ellipsoid.WGS84
          );
          const modelMatrix = Cesium.Matrix4.fromRotationTranslation(rotMatrix, currentPos);

          if (activeEmergency === 'fire') {
            engineFireSystem.show = true;
            engineSmokeSystem.show = true;
            engineFireSystem.modelMatrix = modelMatrix;
            engineSmokeSystem.modelMatrix = modelMatrix;
            const trs = new Cesium.TranslationRotationScale();
            trs.translation = new Cesium.Cartesian3(4.5, -3.0, -0.5); 
            trs.rotation = Cesium.Quaternion.fromAxisAngle(Cesium.Cartesian3.UNIT_X, Cesium.Math.toRadians(-90));
            const emitterModelMatrix = Cesium.Matrix4.fromTranslationRotationScale(trs);
            engineFireSystem.emitterModelMatrix = emitterModelMatrix;
            engineSmokeSystem.emitterModelMatrix = emitterModelMatrix;
          }

          if (activeEmergency === 'fumes') {
            cockpitSmokeSystem.show = true;
            cockpitSmokeSystem.modelMatrix = modelMatrix;
            const trs = new Cesium.TranslationRotationScale();
            trs.translation = new Cesium.Cartesian3(10.0, 0.0, 1.0);
            cockpitSmokeSystem.emitterModelMatrix = Cesium.Matrix4.fromTranslationRotationScale(trs);
          }

          if (activeEmergency === 'gear' && elapsedSec >= 118 && kts > 10) {
            gearSparkSystem.show = true;
            gearSparkSystem.modelMatrix = modelMatrix;
            const trs = new Cesium.TranslationRotationScale();
            trs.translation = new Cesium.Cartesian3(12.0, 0.0, -2.5);
            trs.rotation = Cesium.Quaternion.fromAxisAngle(Cesium.Cartesian3.UNIT_Y, Cesium.Math.toRadians(-30));
            gearSparkSystem.emitterModelMatrix = Cesium.Matrix4.fromTranslationRotationScale(trs);
          }

          if (cameraMode === "cockpit") {
            Cesium.Matrix4.fromRotationTranslation(rotMatrix, currentPos, scratchTransform);
            Cesium.Matrix4.multiplyByTranslation(
              scratchTransform,
              externalNoseOffset,
              mountTransform
            );
            viewer.camera.lookAtTransform(
              mountTransform,
              new Cesium.HeadingPitchRange(
                Cesium.Math.toRadians(90),
                Cesium.Math.toRadians(-2.5), 
                0.1
              )
            );
          }
        }
      }
    });
  </script>
