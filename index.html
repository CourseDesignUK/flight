<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UK Civil Airport 3D Flight Tracker</title>

  <link href="https://cesium.com/downloads/cesiumjs/releases/1.124/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.124/Build/Cesium/Cesium.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #cesiumContainer {
      width: 100%; height: 100%; overflow: hidden; background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      color: #fff;
    }

    .cesium-widget-credits,
    .cesium-credit-logoContainer,
    .cesium-credit-textContainer,
    .cesium-credit-expand-link,
    .cesium-viewer-timelineContainer,
    .cesium-viewer-animationContainer {
      display: none !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }

    .overlay-panel {
      position: absolute;
      background: rgba(13, 17, 23, 0.90);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      padding: 12px 16px;
      backdrop-filter: blur(10px);
      z-index: 100;
    }
    #hud-telemetry { top: 20px; left: 20px; width: 320px; }
    #hud-selector { top: 20px; right: 20px; width: 330px; }
    #hud-emergencies { top: 20px; left: 350px; width: 220px; }

    .hud-title {
      font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
      color: #38bdf8; border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 4px; margin-bottom: 8px; font-weight: 700;
    }
    .data-row { display: flex; justify-content: space-between; margin: 4px 0; font-size: 13px; }
    .data-label { color: #94a3b8; }
    .data-val { font-weight: 600; font-family: monospace; color: #f8fafc; }
    
    select {
      width: 100%; background: #1e293b; color: #38bdf8; border: 1px solid #0284c7;
      padding: 8px; border-radius: 4px; font-weight: 600; cursor: pointer; font-size: 12px;
      outline: none; margin-top: 4px;
    }
    
    #hud-controls { bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; align-items: center; }
    button {
      background: #1e293b; color: #38bdf8; border: 1px solid #0284c7;
      padding: 8px 16px; border-radius: 4px; font-weight: 600; cursor: pointer; font-size: 12px;
    }
    button.active { background: #0284c7; color: #fff; }

    .btn-danger { background: #7f1d1d; border-color: #ef4444; color: #fca5a5; width: 100%; margin-bottom: 6px; }
    .btn-warning { background: #78350f; border-color: #f59e0b; color: #fcd34d; width: 100%; margin-bottom: 6px; }

    #hud-comms {
      bottom: 85px;
      left: 20px;
      width: 480px;
      height: 155px;
      display: flex;
      flex-direction: column;
    }
    #comms-log {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-family: monospace;
      font-size: 11.5px;
      line-height: 1.35;
      padding-right: 4px;
      scroll-behavior: smooth;
    }
    .comm-line {
      display: flex;
      gap: 6px;
      word-break: break-word;
    }
    .comm-time { color: #64748b; flex-shrink: 0; }
    .comm-sender-atc { color: #38bdf8; font-weight: 700; flex-shrink: 0; }
    .comm-sender-pilot { color: #4ade80; font-weight: 700; flex-shrink: 0; }
    .comm-text { color: #f1f5f9; }

    #cockpit-hud-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      display: none;
      z-index: 90;
    }
    .hud-reticle-svg {
      width: 100%;
      height: 100%;
      stroke: #00ff66;
      fill: none;
      stroke-width: 1.5;
      font-family: monospace;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>

  <div id="cockpit-hud-overlay">
    <svg class="hud-reticle-svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice">
      <defs>
        <filter id="hud-glow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#00ff66" />
        </filter>
      </defs>
      <g filter="url(#hud-glow)">
        <path d="M 485 500 L 495 500 M 505 500 L 515 500 M 500 485 L 500 495 M 500 505 L 500 515" />
        <circle cx="500" cy="500" r="3" />
        <circle cx="500" cy="500" r="10" />
        <line x1="490" y1="500" x2="475" y2="500" />
        <line x1="510" y1="500" x2="525" y2="500" />
        <line x1="500" y1="490" x2="500" y2="475" />
        <line x1="360" y1="500" x2="440" y2="500" stroke-dasharray="8 4" />
        <line x1="560" y1="500" x2="640" y2="500" stroke-dasharray="8 4" />
        <path d="M 410 440 L 440 440 L 440 448 M 590 440 L 560 440 L 560 448" />
        <text x="390" y="444" fill="#00ff66" stroke="none">+5</text>
        <text x="600" y="444" fill="#00ff66" stroke="none">+5</text>
        <path d="M 410 560 L 440 560 L 440 552 M 590 560 L 560 560 L 560 552" stroke-dasharray="6 3" />
        <text x="390" y="564" fill="#00ff66" stroke="none">-5</text>
        <text x="600" y="564" fill="#00ff66" stroke="none">-5</text>
        <rect x="380" y="70" width="240" height="28" stroke="#00ff66" />
        <polygon points="500,103 495,110 505,110" fill="#00ff66" />
        <text id="hud-cockpit-hdg" x="500" y="90" text-anchor="middle" fill="#00ff66" stroke="none" font-weight="bold" font-size="14">HDG: ---°</text>
        <rect x="230" y="380" width="80" height="240" stroke="#00ff66" />
        <text x="270" y="405" text-anchor="middle" fill="#00ff66" stroke="none">GS KTS</text>
        <text id="hud-cockpit-spd" x="270" y="505" text-anchor="middle" fill="#00ff66" stroke="none" font-size="20" font-weight="bold">---</text>
        <rect x="690" y="380" width="90" height="240" stroke="#00ff66" />
        <text x="735" y="405" text-anchor="middle" fill="#00ff66" stroke="none">ALT FT</text>
        <text id="hud-cockpit-alt" x="735" y="505" text-anchor="middle" fill="#00ff66" stroke="none" font-size="20" font-weight="bold">---</text>
      </g>
    </svg>
  </div>

  <div id="hud-telemetry" class="overlay-panel">
    <div class="hud-title" id="hud-station-title">Airport Telemetry</div>
    <div class="data-row"><span class="data-label">Callsign:</span><span class="data-val">SPEEDBIRD 3</span></div>
    <div class="data-row"><span class="data-label">Phase:</span><span class="data-val" id="hud-approach">6-mile Final</span></div>
    <div class="data-row"><span class="data-label">Altitude:</span><span class="data-val" id="hud-alt">-- ft</span></div>
    <div class="data-row"><span class="data-label">Ground Speed:</span><span class="data-val" id="hud-speed">-- kts</span></div>
    <div class="data-row"><span class="data-label">Threshold Dist:</span><span class="data-val" id="hud-dist">-- NM</span></div>
    <div class="data-row"><span class="data-label">Coordinates:</span><span class="data-val" id="hud-coords">-- , --</span></div>
  </div>

  <div id="hud-emergencies" class="overlay-panel">
    <div class="hud-title">Failures</div>
    <button id="btn-em-fire" class="btn-danger">Engine Fire</button>
    <button id="btn-em-fumes" class="btn-danger">Cockpit Fumes</button>
    <button id="btn-em-gear" class="btn-warning">Stuck Gear</button>
  </div>

  <div id="hud-selector" class="overlay-panel">
    <div class="hud-title">Select UK Commercial Airport</div>
    <select id="airfieldSelect"></select>
  </div>

  <div id="hud-comms" class="overlay-panel">
    <div class="hud-title" style="display:flex; justify-content:space-between;">
      <span id="comms-title">VHF COM: APPROACH</span>
      <span style="color:#22c55e;">LIVE TRANSCRIPT</span>
    </div>
    <div id="comms-log"></div>
  </div>

  <div id="hud-controls" class="overlay-panel">
    <button id="btn-playpause">Pause</button>
    <button id="btn-chase" class="active">Chase Cam</button>
    <button id="btn-cockpit">Cockpit View</button>
    <button id="btn-tower">Tower View</button>
    <button id="btn-free">Free Orbit</button>
    <button id="btn-lighting">Night Mode</button>
    <select id="speedSelect" style="width: auto; margin-top: 0; margin-left: 5px;">
      <option value="1">1x Speed</option>
      <option value="2">2x Speed</option>
      <option value="4">4x Speed</option>
    </select>
  </div>

  <script>
    const viewer = new Cesium.Viewer("cesiumContainer", {
      baseLayer: new Cesium.ImageryLayer(
        new Cesium.UrlTemplateImageryProvider({
          url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
          maximumLevel: 19
        })
      ),
      baseLayerPicker: false,
      geocoder: false,
      homeButton: false,
      infoBox: false,
      selectionIndicator: false,
      navigationHelpButton: false,
      animation: false,
      timeline: false,
      shouldAnimate: true,
      creditContainer: document.createElement("div")
    });

    viewer.scene.globe.enableLighting = false;
    viewer.scene.highDynamicRange = false;

    const airports = {
      egll: { name: "London Heathrow",      icao: "EGLL", lat: 51.4774, lon: -0.4580, heading: 270, rwy: "27R", atcName: "Heathrow Director", twrName: "Heathrow Tower", altMeters: 25, appFreq: "119.725", twrFreq: "118.500" },
      egkk: { name: "London Gatwick",       icao: "EGKK", lat: 51.1537, lon: -0.1821, heading: 260, rwy: "26L", atcName: "Gatwick Director",  twrName: "Gatwick Tower",  altMeters: 62, appFreq: "126.825", twrFreq: "124.225" },
      egss: { name: "London Stansted",      icao: "EGSS", lat: 51.8860, lon:  0.2389, heading: 220, rwy: "22",  atcName: "Stansted Radar",    twrName: "Stansted Tower", altMeters: 106, appFreq: "120.625", twrFreq: "123.800" },
      eggw: { name: "London Luton",         icao: "EGGW", lat: 51.8747, lon: -0.3683, heading: 260, rwy: "26",  atcName: "Luton Radar",       twrName: "Luton Tower",    altMeters: 160, appFreq: "129.550", twrFreq: "132.550" },
      eglc: { name: "London City",          icao: "EGLC", lat: 51.5053, lon:  0.0553, heading: 270, rwy: "27",  atcName: "Thames Radar",      twrName: "City Tower",     altMeters: 6,   appFreq: "132.700", twrFreq: "118.075" },
      egcc: { name: "Manchester",           icao: "EGCC", lat: 53.3537, lon: -2.2750, heading: 230, rwy: "23R", atcName: "Manchester Radar", twrName: "Manchester Tower",altMeters: 78, appFreq: "118.575", twrFreq: "118.625" },
      egbb: { name: "Birmingham",           icao: "EGBB", lat: 52.4539, lon: -1.7480, heading: 330, rwy: "33",  atcName: "Birmingham Radar", twrName: "Birmingham Tower",altMeters: 100, appFreq: "131.000", twrFreq: "118.300" },
      egph: { name: "Edinburgh",            icao: "EGPH", lat: 55.9500, lon: -3.3725, heading: 240, rwy: "24",  atcName: "Edinburgh Radar",  twrName: "Edinburgh Tower",altMeters: 41, appFreq: "121.200", twrFreq: "118.700" },
      egpf: { name: "Glasgow",              icao: "EGPF", lat: 55.8719, lon: -4.4331, heading: 230, rwy: "23",  atcName: "Glasgow Radar",    twrName: "Glasgow Tower",  altMeters: 8,   appFreq: "119.100", twrFreq: "118.800" },
      eggd: { name: "Bristol",              icao: "EGGD", lat: 51.3827, lon: -2.7191, heading: 270, rwy: "27",  atcName: "Bristol Radar",    twrName: "Bristol Tower",  altMeters: 190, appFreq: "125.650", twrFreq: "133.850" },
      egnt: { name: "Newcastle",            icao: "EGNT", lat: 55.0375, lon: -1.6917, heading: 250, rwy: "25",  atcName: "Newcastle Radar",  twrName: "Newcastle Tower",altMeters: 81, appFreq: "124.375", twrFreq: "119.700" },
      eggp: { name: "Liverpool John Lennon",icao: "EGGP", lat: 53.3336, lon: -2.8497, heading: 270, rwy: "27",  atcName: "Liverpool Radar",  twrName: "Liverpool Tower",altMeters: 25, appFreq: "119.850", twrFreq: "126.350" },
      egnm: { name: "Leeds Bradford",       icao: "EGNM", lat: 53.8659, lon: -1.6606, heading: 320, rwy: "32",  atcName: "Leeds Radar",      twrName: "Leeds Tower",    altMeters: 208, appFreq: "134.575", twrFreq: "120.300" },
      egnx: { name: "East Midlands",        icao: "EGNX", lat: 52.8311, lon: -1.3281, heading: 270, rwy: "27",  atcName: "East Midlands Radar", twrName: "Tower",       altMeters: 93,  appFreq: "134.175", twrFreq: "124.000" },
      egaa: { name: "Belfast International",icao: "EGAA", lat: 54.6575, lon: -6.2158, heading: 250, rwy: "25",  atcName: "Belfast Radar",    twrName: "Aldergrove Tower",altMeters: 82, appFreq: "128.500", twrFreq: "118.300" },
      egac: { name: "George Best Belfast City",icao: "EGAC", lat: 54.6181, lon: -5.8725, heading: 220, rwy: "22", atcName: "City Approach",  twrName: "City Tower",     altMeters: 5,   appFreq: "130.850", twrFreq: "122.825" },
      egpd: { name: "Aberdeen",             icao: "EGPD", lat: 57.2019, lon: -2.1978, heading: 340, rwy: "34",  atcName: "Aberdeen Radar",   twrName: "Aberdeen Tower", altMeters: 66, appFreq: "119.050", twrFreq: "118.100" },
      egff: { name: "Cardiff",              icao: "EGFF", lat: 51.3967, lon: -3.3433, heading: 300, rwy: "30",  atcName: "Cardiff Radar",    twrName: "Cardiff Tower",  altMeters: 67, appFreq: "119.150", twrFreq: "133.100" },
      egte: { name: "Exeter",               icao: "EGTE", lat: 50.7344, lon: -3.4139, heading: 260, rwy: "26",  atcName: "Exeter Approach",  twrName: "Exeter Tower",   altMeters: 31, appFreq: "128.975", twrFreq: "119.800" },
      eghi: { name: "Southampton",          icao: "EGHI", lat: 50.9503, lon: -1.3568, heading: 200, rwy: "20",  atcName: "Southampton Radar",twrName: "Tower",          altMeters: 13, appFreq: "122.725", twrFreq: "118.200" },
      eghh: { name: "Bournemouth",          icao: "EGHH", lat: 50.7800, lon: -1.8425, heading: 260, rwy: "26",  atcName: "Bournemouth Radar",twrName: "Tower",          altMeters: 12, appFreq: "119.475", twrFreq: "125.600" },
      egsh: { name: "Norwich",              icao: "EGSH", lat: 52.6758, lon:  1.2828, heading: 270, rwy: "27",  atcName: "Norwich Radar",    twrName: "Norwich Tower",  altMeters: 36, appFreq: "119.350", twrFreq: "124.250" },
      egpe: { name: "Inverness",            icao: "EGPE", lat: 57.5400, lon: -4.0475, heading: 230, rwy: "23",  atcName: "Inverness Approach",twrName: "Tower",         altMeters: 9,   appFreq: "122.600", twrFreq: "118.400" },
      egsc: { name: "Cambridge City",       icao: "EGSC", lat: 52.2050, lon:  0.1750, heading: 230, rwy: "23",  atcName: "Cambridge Approach",twrName: "Tower",         altMeters: 15, appFreq: "120.900", twrFreq: "125.900" },
      egns: { name: "Isle of Man (Ronaldsway)", icao: "EGNS", lat: 54.0833, lon: -4.6239, heading: 260, rwy: "26", atcName: "Isle of Man Approach", twrName: "Tower",    altMeters: 16, appFreq: "135.900", twrFreq: "118.900" },
      egjb: { name: "Guernsey",             icao: "EGJB", lat: 49.4350, lon: -2.6003, heading: 270, rwy: "27",  atcName: "Guernsey Approach",twrName: "Guernsey Tower", altMeters: 102, appFreq: "128.650", twrFreq: "119.950" },
      egjj: { name: "Jersey",               icao: "EGJJ", lat: 49.2078, lon: -2.1956, heading: 260, rwy: "26",  atcName: "Jersey Approach",  twrName: "Jersey Tower",   altMeters: 84, appFreq: "120.450", twrFreq: "119.450" }
    };

    // Particle Systems for emergencies
    const engineFireSystem = viewer.scene.primitives.add(new Cesium.ParticleSystem({
      image: 'https://sandcastle.cesium.com/SampleData/fire.png',
      startColor: Cesium.Color.RED.withAlpha(0.9),
      endColor: Cesium.Color.YELLOW.withAlpha(0.1),
      startScale: 1.0,
      endScale: 4.0,
      minimumParticleLife: 0.5,
      maximumParticleLife: 1.2,
      minimumSpeed: 8.0,
      maximumSpeed: 14.0,
      imageSize: new Cesium.Cartesian2(5, 5),
      emissionRate: 50.0,
      emitter: new Cesium.ConeEmitter(Cesium.Math.toRadians(15.0)),
      show: false
    }));

    const engineSmokeSystem = viewer.scene.primitives.add(new Cesium.ParticleSystem({
      image: 'https://sandcastle.cesium.com/SampleData/smoke.png',
      startColor: Cesium.Color.DARKGRAY.withAlpha(0.8),
      endColor: Cesium.Color.BLACK.withAlpha(0.0),
      startScale: 2.0,
      endScale: 10.0,
      minimumParticleLife: 2.0,
      maximumParticleLife: 4.0,
      minimumSpeed: 6.0,
      maximumSpeed: 12.0,
      imageSize: new Cesium.Cartesian2(7, 7),
      emissionRate: 40.0,
      emitter: new Cesium.ConeEmitter(Cesium.Math.toRadians(15.0)),
      show: false
    }));

    const cockpitSmokeSystem = viewer.scene.primitives.add(new Cesium.ParticleSystem({
      image: 'https://sandcastle.cesium.com/SampleData/smoke.png',
      startColor: Cesium.Color.LIGHTGRAY.withAlpha(0.6),
      endColor: Cesium.Color.WHITE.withAlpha(0.0),
      startScale: 1.0,
      endScale: 5.0,
      minimumParticleLife: 1.0,
      maximumParticleLife: 3.0,
      minimumSpeed: 2.0,
      maximumSpeed: 5.0,
      imageSize: new Cesium.Cartesian2(4, 4),
      emissionRate: 20.0,
      emitter: new Cesium.SphereEmitter(0.5),
      show: false
    }));

    const gearSparkSystem = viewer.scene.primitives.add(new Cesium.ParticleSystem({
      image: 'https://sandcastle.cesium.com/SampleData/fire.png',
      startColor: Cesium.Color.YELLOW.withAlpha(1.0),
      endColor: Cesium.Color.WHITE.withAlpha(0.0),
      startScale: 0.5,
      endScale: 0.1,
      minimumParticleLife: 0.1,
      maximumParticleLife: 0.3,
      minimumSpeed: 15.0,
      maximumSpeed: 25.0,
      imageSize: new Cesium.Cartesian2(2, 2),
      emissionRate: 150.0,
      emitter: new Cesium.ConeEmitter(Cesium.Math.toRadians(45.0)),
      show: false
    }));

    const selectElem = document.getElementById("airfieldSelect");
    Object.entries(airports).forEach(([key, ap]) => {
      const opt = document.createElement("option");
      opt.value = key;
      opt.textContent = `${ap.name} (${ap.icao})`;
      selectElem.appendChild(opt);
    });

    let aircraftEntity = null;
    let positionProperty = null;
    let cameraMode = "chase";
    let radioScript = [];
    let displayedCommIndices = new Set();
    let currentAirportKey = "egll";
    let isNight = false;
    let activeEmergency = 'none';

    // Speech Synthesis initialization
    let voices = [];
    let audioUnlocked = false;

    function initVoices() {
      voices = window.speechSynthesis.getVoices();
    }
    initVoices();
    if (window.speechSynthesis && window.speechSynthesis.onvoiceschanged !== undefined) {
      window.speechSynthesis.onvoiceschanged = initVoices;
    }

    function unlockAudio() {
      if (!audioUnlocked && "speechSynthesis" in window) {
        const silent = new SpeechSynthesisUtterance("");
        window.speechSynthesis.speak(silent);
        audioUnlocked = true;
      }
    }
    window.addEventListener("click", unlockAudio, { once: true });
    window.addEventListener("keydown", unlockAudio, { once: true });

    function dispatchComm(comm, timeMins, timeSecs) {
      const phoneticText = comm.text
        .replace(/Runway (\d)(\d)([a-zA-Z]?)/gi, (match, d1, d2, lr) => {
          let spoken = "Runway " + d1 + " " + d2;
          if (lr && lr.toUpperCase() === 'L') spoken += " Left";
          else if (lr && lr.toUpperCase() === 'R') spoken += " Right";
          return spoken;
        })
        .replace(/QNH/gi, "Q-N-H")
        .replace(/ILS/gi, "I-L-S")
        .replace(/DME/gi, "D-M-E")
        .replace(/BAW3/gi, "Speedbird 3")
        .replace(/1013/gi, "1 0 1 3")
        .replace(/1014/gi, "1 0 1 4")
        // Speak frequencies as separate digits with "decimal"
        .replace(/(\d{3})\.(\d+)/g, (match, p1, p2) => {
          let decimalPart = p2.replace(/0+$/, ''); // Strip trailing zeros
          if (!decimalPart) decimalPart = '0'; // Handle exact decimals like .000
          return p1.split('').join(' ') + ' decimal ' + decimalPart.split('').join(' ');
        });

      function updateUI() {
        const commsTitle = document.getElementById("comms-title");
        const commsLog = document.getElementById("comms-log");
        
        commsTitle.textContent = `${comm.label.toUpperCase()} (${comm.freq} MHz)`;
        const line = document.createElement("div");
        line.className = "comm-line";
        const senderClass = comm.sender === "atc" ? "comm-sender-atc" : "comm-sender-pilot";
        const senderLabel = comm.sender === "atc" ? "ATC:" : "BAW3:";
        
        line.innerHTML = `<span class="comm-time">[+${timeMins}:${timeSecs}]</span><span class="${senderClass}">${senderLabel}</span><span class="comm-text">${comm.text}</span>`;
        commsLog.appendChild(line);
        commsLog.scrollTop = commsLog.scrollHeight;
      }

      if (!("speechSynthesis" in window) || !window.speechSynthesis) {
        updateUI();
        return;
      }

      const utterance = new SpeechSynthesisUtterance(phoneticText);
      utterance.lang = "en-GB";

      if (comm.sender === "atc") {
        utterance.pitch = 0.85;
        utterance.rate = 1.05;
        const atcVoice = voices.find(v => v.lang.includes("en") && (v.name.includes("Male") || v.name.includes("George") || v.name.includes("Oliver") || v.name.includes("David")));
        if (atcVoice) utterance.voice = atcVoice;
      } else {
        utterance.pitch = 1.25;
        utterance.rate = 1.05;
        const pilotVoice = voices.find(v => v.lang.includes("en") && (
          v.name.includes("Female") ||
          v.name.includes("Samantha") ||
          v.name.includes("Victoria") ||
          v.name.includes("Zira") ||
          v.name.includes("Hazel") ||
          v.name.includes("Susan") ||
          v.name.includes("Karen") ||
          v.name.includes("Catherine")
        ));
        if (pilotVoice) utterance.voice = pilotVoice;
      }

      utterance.onstart = updateUI;
      utterance.onerror = updateUI;
      window.speechSynthesis.speak(utterance);
    }

    const startTime = Cesium.JulianDate.fromIso8601("2026-06-21T12:00:00Z");
    const duration = 190;
    const stopTime = Cesium.JulianDate.addSeconds(startTime, duration, new Cesium.JulianDate());

    viewer.clock.startTime = startTime.clone();
    viewer.clock.stopTime = stopTime.clone();
    viewer.clock.currentTime = startTime.clone();
    viewer.clock.clockRange = Cesium.ClockRange.LOOP_STOP;
    viewer.clock.multiplier = 1.0;

    function calculateDestination(lat, lon, bearingDeg, distanceMeters) {
      const R = 6371000;
      const rad = Math.PI / 180;
      const rLat = lat * rad;
      const rLon = lon * rad;
      const rBearing = bearingDeg * rad;
      const dR = distanceMeters / R;
      const nLat = Math.asin(Math.sin(rLat) * Math.cos(dR) + Math.cos(rLat) * Math.sin(dR) * Math.cos(rBearing));
      const nLon = rLon + Math.atan2(Math.sin(rBearing) * Math.sin(dR) * Math.cos(rLat), Math.cos(dR) - Math.sin(rLat) * Math.sin(nLat));
      return { lat: nLat / rad, lon: nLon / rad };
    }

    function generateNormalDialogue(ap) {
      const fieldElevationFt = ap.altMeters * 3.28084;
      const assignedAltFt = Math.round((3000 + fieldElevationFt) / 100) * 100;
      const intAltFt = Math.round((2200 + fieldElevationFt) / 100) * 100;

      // Accurately synchronized to the generated waypoints (touchdown at s: 120, stop at s: 170)
      return [
        { s: 2, phase: "6-mile Final", sender: "atc", freq: ap.appFreq, label: ap.atcName, text: `Speedbird 3, ${ap.atcName}, radar contact 6 miles straight-in. Descend to altitude ${assignedAltFt} feet on QNH 1013.` },
        { s: 10, phase: "6-mile Final", sender: "pilot", freq: ap.appFreq, label: "BAW3", text: `Descend ${assignedAltFt} feet on 1013, cleared ILS Runway ${ap.rwy}, Speedbird 3.` },
        { s: 25, phase: "Glidepath Intercept", sender: "pilot", freq: ap.appFreq, label: "BAW3", text: `Speedbird 3 descending through ${intAltFt} feet, localiser captured, glide slope alive.` },
        { s: 32, phase: "Glidepath Intercept", sender: "atc", freq: ap.appFreq, label: ap.atcName, text: `Speedbird 3, roger. Maintain 150 knots to 4 DME. Contact ${ap.twrName} on ${ap.twrFreq}.` },
        { s: 40, phase: "Glidepath Intercept", sender: "pilot", freq: ap.twrFreq, label: "BAW3", text: `150 to 4, over to Tower on ${ap.twrFreq}, good day. Speedbird 3.` },
        { s: 55, phase: "Established 4 DME", sender: "pilot", freq: ap.twrFreq, label: "BAW3", text: `${ap.twrName}, Speedbird 3 fully established Runway ${ap.rwy}, 4 miles out.` },
        { s: 62, phase: "Established 4 DME", sender: "atc", freq: ap.twrFreq, label: ap.twrName, text: `Speedbird 3, ${ap.twrName}, welcome. Continue approach Runway ${ap.rwy}, wind ${ap.heading - 10} degrees at 8 knots.` },
        { s: 80, phase: "Short Final 2 DME", sender: "pilot", freq: ap.twrFreq, label: "BAW3", text: `Speedbird 3, 2 miles, gear down and locked, flaps full, landing checks complete.` },
        { s: 88, phase: "Short Final 2 DME", sender: "atc", freq: ap.twrFreq, label: ap.twrName, text: `Speedbird 3, wind ${(ap.heading + 5) % 360} degrees at 9 knots, Runway ${ap.rwy} cleared to land.` },
        { s: 96, phase: "Short Final 2 DME", sender: "pilot", freq: ap.twrFreq, label: "BAW3", text: `Cleared to land Runway ${ap.rwy}, Speedbird 3.` },
        { s: 111, phase: "Threshold Crossing", sender: "pilot", freq: ap.twrFreq, label: "BAW3", text: `Passing threshold, 50... 30... 10... Retard.` },
        { s: 120, phase: "Touchdown & Rollout", sender: "pilot", freq: ap.twrFreq, label: "BAW3", text: `Touchdown.` },
        { s: 145, phase: "Rollout", sender: "atc", freq: ap.twrFreq, label: ap.twrName, text: `Speedbird 3, turn left at the end, contact Ground on 121.7.` },
        { s: 153, phase: "Vacating", sender: "pilot", freq: ap.twrFreq, label: "BAW3", text: `Left at the end, over to Ground on 121.7, Speedbird 3.` }
      ];
    }

    function loadAirport(key) {
      if (window.speechSynthesis) {
        window.speechSynthesis.cancel();
      }

      activeEmergency = 'none';
      currentAirportKey = key;
      const ap = airports[key];
      document.getElementById("hud-station-title").textContent = `${ap.name} Telemetry`;

      viewer.clock.currentTime = startTime.clone();
      radioScript = generateNormalDialogue(ap);
      displayedCommIndices.clear();
      document.getElementById("comms-log").innerHTML = "";

      const reciprocalHeading = (ap.heading + 180) % 360;
      const visualGroundZ = 2.0;

      // Linear points simulating descent and gradual deceleration to an exact stop at s: 170
      const rawWaypoints = [
        { s: 0,   dist: 11075, z: visualGroundZ + 580 }, // 6.0 NM
        { s: 30,  dist: 7535,  z: visualGroundZ + 387 }, // 4.0 NM
        { s: 60,  dist: 4535,  z: visualGroundZ + 231 }, // 2.4 NM
        { s: 90,  dist: 1925,  z: visualGroundZ + 97 },  // 1.0 NM
        { s: 110, dist: 385,   z: visualGroundZ + 25 },  // 0.2 NM
        { s: 115, dist: 0,     z: visualGroundZ + 15 },  // Threshold (~50 ft)
        { s: 120, dist: -350,  z: visualGroundZ },       // Touchdown (matches s: 120 dialogue)
        { s: 135, dist: -1100, z: visualGroundZ },       // Rollout fast
        { s: 155, dist: -1700, z: visualGroundZ },       // Rollout slow
        { s: 170, dist: -1850, z: visualGroundZ },       // Complete Stop
        { s: 171, dist: -1850, z: visualGroundZ },       // Interpolation hold
        { s: 190, dist: -1850, z: visualGroundZ }        // Remain stopped
      ];

      const waypoints = rawWaypoints.map(wp => {
        const bearing = wp.dist >= 0 ? reciprocalHeading : ap.heading;
        const coords = calculateDestination(ap.lat, ap.lon, bearing, Math.abs(wp.dist));
        return { s: wp.s, lon: coords.lon, lat: coords.lat, z: wp.z };
      });

      positionProperty = new Cesium.SampledPositionProperty();
      positionProperty.setInterpolationOptions({
        interpolationDegree: 1,
        interpolationAlgorithm: Cesium.LinearApproximation
      });

      waypoints.forEach(wp => {
        const time = Cesium.JulianDate.addSeconds(startTime, wp.s, new Cesium.JulianDate());
        const pos = Cesium.Cartesian3.fromDegrees(wp.lon, wp.lat, wp.z);
        positionProperty.addSample(time, pos);
      });

      if (aircraftEntity) {
        viewer.entities.remove(aircraftEntity);
      }

      aircraftEntity = viewer.entities.add({
        availability: new Cesium.TimeIntervalCollection([
          new Cesium.TimeInterval({ start: startTime, stop: stopTime })
        ]),
        position: positionProperty,
        orientation: new Cesium.VelocityOrientationProperty(positionProperty),
        model: {
          uri: "https://raw.githubusercontent.com/CesiumGS/cesium/main/Apps/SampleData/models/CesiumAir/Cesium_Air.glb",
          minimumPixelSize: 64,
          maximumScale: 1000
        },
        path: {
          resolution: 1,
          material: new Cesium.PolylineGlowMaterialProperty({
            glowPower: 0.25,
            color: Cesium.Color.fromCssColorString("#38bdf8")
          }),
          width: 3,
          leadTime: 0,
          trailTime: 120
        }
      });

      if (cameraMode === "chase") {
        viewer.trackedEntity = aircraftEntity;
      } else if (cameraMode === "tower") {
        setTowerCamera();
      }
    }

    function setTowerCamera() {
      const ap = airports[currentAirportKey];
      viewer.camera.flyTo({
        destination: Cesium.Cartesian3.fromDegrees(ap.lon, ap.lat, 120),
        orientation: {
          heading: Cesium.Math.toRadians((ap.heading + 180) % 360),
          pitch: Cesium.Math.toRadians(5),
          roll: 0
        },
        duration: 1.0
      });
    }

    function triggerEmergency(type) {
      if (activeEmergency !== 'none') return;
      activeEmergency = type;
      
      const currentTime = viewer.clock.currentTime;
      const elapsedSec = Cesium.JulianDate.secondsDifference(currentTime, startTime);
      const ap = airports[currentAirportKey];

      radioScript = radioScript.filter(comm => comm.s <= elapsedSec);
      
      if (window.speechSynthesis) window.speechSynthesis.cancel(); 

      const injectTime = Math.max(Math.floor(elapsedSec) + 1, 10);

      // Dialogue triggers are bound strictly to the telemetry (Touchdown is s: 120, Complete Stop is s: 170)
      if (type === 'fire') {
        radioScript.push({ s: injectTime, phase: "Emergency Declared", sender: "pilot", freq: ap.appFreq, label: "BAW3", text: `MAYDAY, MAYDAY, MAYDAY, Speedbird 3, engine fire number two, severe loss of power. Requesting immediate priority landing Runway ${ap.rwy}.` });
        radioScript.push({ s: injectTime + 9, phase: "Emergency Declared", sender: "atc", freq: ap.appFreq, label: ap.atcName, text: `Speedbird 3, MAYDAY acknowledged. Number one for Runway ${ap.rwy}, cleared to land. Fire rescue deployed.` });
        radioScript.push({ s: injectTime + 18, phase: "Emergency Declared", sender: "pilot", freq: ap.appFreq, label: "BAW3", text: `Cleared to land Runway ${ap.rwy}, Speedbird 3. Running checklists.` });
        radioScript.push({ s: 120, phase: "Touchdown & Rollout", sender: "pilot", freq: ap.appFreq, label: "BAW3", text: `Touchdown. Maximum braking. Stopping on the runway.` });
        radioScript.push({ s: 171, phase: "Evacuation", sender: "pilot", freq: ap.appFreq, label: "BAW3", text: `Speedbird 3 has stopped. Initiating immediate evacuation on the runway.` });
      } else if (type === 'fumes') {
        radioScript.push({ s: injectTime, phase: "Emergency Declared", sender: "pilot", freq: ap.appFreq, label: "BAW3", text: `MAYDAY, MAYDAY, MAYDAY, Speedbird 3, acrid smoke and fumes in the cockpit. Crew donning oxygen masks.` });
        radioScript.push({ s: injectTime + 9, phase: "Emergency Declared", sender: "atc", freq: ap.appFreq, label: ap.atcName, text: `Speedbird 3, MAYDAY acknowledged. Cleared to land Runway ${ap.rwy}. Emergency services standing by.` });
        radioScript.push({ s: injectTime + 18, phase: "Emergency Declared", sender: "pilot", freq: ap.appFreq, label: "BAW3", text: `Cleared to land Runway ${ap.rwy}, Speedbird 3.` });
        radioScript.push({ s: 120, phase: "Touchdown & Rollout", sender: "pilot", freq: ap.appFreq, label: "BAW3", text: `Speedbird 3, touchdown. Braking hard.` });
        radioScript.push({ s: 171, phase: "Evacuation", sender: "pilot", freq: ap.appFreq, label: "BAW3", text: `Speedbird 3 stopped. Evacuating via slides.` });
      } else if (type === 'gear') {
        radioScript.push({ s: injectTime, phase: "Emergency Declared", sender: "pilot", freq: ap.appFreq, label: "BAW3", text: `MAYDAY, MAYDAY, MAYDAY, Speedbird 3, unsafe gear indication. Nose gear shows not locked.` });
        radioScript.push({ s: injectTime + 9, phase: "Emergency Declared", sender: "atc", freq: ap.appFreq, label: ap.atcName, text: `Speedbird 3, MAYDAY acknowledged. Crash rescue alerted. Cleared to land Runway ${ap.rwy}.` });
        radioScript.push({ s: 112, phase: "Emergency Declared", sender: "pilot", freq: ap.appFreq, label: "BAW3", text: `Cleared to land, Speedbird 3. Bracing for impact on touchdown.` });
        radioScript.push({ s: 120, phase: "Touchdown & Rollout", sender: "pilot", freq: ap.appFreq, label: "BAW3", text: `Touchdown. Holding nose off as long as possible.` });
        radioScript.push({ s: 135, phase: "Touchdown & Rollout", sender: "pilot", freq: ap.appFreq, label: "BAW3", text: `Nose is down. Scraping.` });
        radioScript.push({ s: 171, phase: "Evacuation", sender: "pilot", freq: ap.appFreq, label: "BAW3", text: `Speedbird 3 stopped. Commencing evacuation.` });
      }

      radioScript.sort((a, b) => a.s - b.s);
      
      document.getElementById("btn-em-fire").disabled = true;
      document.getElementById("btn-em-fumes").disabled = true;
      document.getElementById("btn-em-gear").disabled = true;
    }

    document.getElementById("btn-em-fire").onclick = () => triggerEmergency('fire');
    document.getElementById("btn-em-fumes").onclick = () => triggerEmergency('fumes');
    document.getElementById("btn-em-gear").onclick = () => triggerEmergency('gear');

    loadAirport("egll");

    selectElem.onchange = (e) => {
      document.getElementById("btn-em-fire").disabled = false;
      document.getElementById("btn-em-fumes").disabled = false;
      document.getElementById("btn-em-gear").disabled = false;
      loadAirport(e.target.value);
    };

    const btnPlayPause = document.getElementById("btn-playpause");
    const btnChase = document.getElementById("btn-chase");
    const btnCockpit = document.getElementById("btn-cockpit");
    const btnTower = document.getElementById("btn-tower");
    const btnFree = document.getElementById("btn-free");
    const btnLighting = document.getElementById("btn-lighting");
    const speedSelect = document.getElementById("speedSelect");
    const modeButtons = [btnChase, btnCockpit, btnTower, btnFree];
    const cockpitOverlay = document.getElementById("cockpit-hud-overlay");

    btnPlayPause.onclick = () => {
      const isAnimating = viewer.clock.shouldAnimate;
      viewer.clock.shouldAnimate = !isAnimating;
      btnPlayPause.textContent = isAnimating ? "Play" : "Pause";
      
      if (window.speechSynthesis) {
        if (isAnimating) {
          window.speechSynthesis.pause();
        } else {
          window.speechSynthesis.resume();
        }
      }
    };

    function setActiveMode(newMode, activeBtn) {
      cameraMode = newMode;
      modeButtons.forEach(b => b.classList.remove("active"));
      activeBtn.classList.add("active");
      cockpitOverlay.style.display = (cameraMode === "cockpit") ? "block" : "none";
      viewer.camera.lookAtTransform(Cesium.Matrix4.IDENTITY);
    }

    btnChase.onclick = () => {
      setActiveMode("chase", btnChase);
      viewer.trackedEntity = aircraftEntity;
    };

    btnCockpit.onclick = () => {
      setActiveMode("cockpit", btnCockpit);
      viewer.trackedEntity = undefined;
    };

    btnTower.onclick = () => {
      setActiveMode("tower", btnTower);
      viewer.trackedEntity = undefined;
      setTowerCamera();
    };

    btnFree.onclick = () => {
      setActiveMode("free", btnFree);
      viewer.trackedEntity = undefined;
    };

    btnLighting.onclick = () => {
      isNight = !isNight;
      btnLighting.textContent = isNight ? "Day Mode" : "Night Mode";
      if (isNight) {
        viewer.scene.globe.enableLighting = true;
        viewer.scene.light = new Cesium.DirectionalLight({
          direction: new Cesium.Cartesian3(0.1, 0.2, -0.95),
          intensity: 0.2
        });
      } else {
        viewer.scene.globe.enableLighting = false;
        viewer.scene.light = new Cesium.SunLight();
      }
    };

    speedSelect.onchange = (e) => {
      viewer.clock.multiplier = parseFloat(e.target.value);
    };

    const hudAlt = document.getElementById("hud-alt");
    const hudSpeed = document.getElementById("hud-speed");
    const hudCoords = document.getElementById("hud-coords");
    const hudApproach = document.getElementById("hud-approach");
    const hudDist = document.getElementById("hud-dist");
    const hudCockpitHdg = document.getElementById("hud-cockpit-hdg");
    const hudCockpitSpd = document.getElementById("hud-cockpit-spd");
    const hudCockpitAlt = document.getElementById("hud-cockpit-alt");

    const scratchVelocity = new Cesium.Cartesian3();
    const scratchTransform = new Cesium.Matrix4();
    const mountTransform = new Cesium.Matrix4();
    const externalNoseOffset = new Cesium.Cartesian3(0.0, 12.0, 2.5);
    let lastValidVelocity = new Cesium.Cartesian3(0, 1, 0);
    const visualGroundZ = 2.0;

    viewer.scene.preRender.addEventListener(() => {
      if (!positionProperty) return;
      const currentTime = viewer.clock.currentTime;
      const currentPos = positionProperty.getValue(currentTime);
      const elapsedSec = Cesium.JulianDate.secondsDifference(currentTime, startTime);
      const ap = airports[currentAirportKey];

      if (elapsedSec < 0.5 && displayedCommIndices.size > 0) {
        displayedCommIndices.clear();
        document.getElementById("comms-log").innerHTML = "";
        if (window.speechSynthesis) window.speechSynthesis.cancel();
        activeEmergency = 'none';
        document.getElementById("btn-em-fire").disabled = false;
        document.getElementById("btn-em-fumes").disabled = false;
        document.getElementById("btn-em-gear").disabled = false;
      }

      radioScript.forEach((comm, index) => {
        if (elapsedSec >= comm.s && !displayedCommIndices.has(index)) {
          displayedCommIndices.add(index);
          const timeMins = Math.floor(comm.s / 60).toString().padStart(2, "0");
          const timeSecs = Math.floor(comm.s % 60).toString().padStart(2, "0");
          dispatchComm(comm, timeMins, timeSecs);
        }
      });

      if (activeEmergency !== 'none') {
        hudApproach.style.color = "#ef4444";
        if (elapsedSec < 110) hudApproach.textContent = "EMERGENCY APPROACH";
        else if (elapsedSec < 115) hudApproach.textContent = "EMERGENCY SHORT FINAL";
        else if (elapsedSec < 170) hudApproach.textContent = "EMERGENCY ROLLOUT";
        else hudApproach.textContent = "EMERGENCY EVACUATION";
      } else {
        hudApproach.style.color = "#f8fafc";
        if (elapsedSec < 30) hudApproach.textContent = "6-mile Final";
        else if (elapsedSec < 60) hudApproach.textContent = "Glide path Intercept";
        else if (elapsedSec < 85) hudApproach.textContent = "4-mile Final";
        else if (elapsedSec < 110) hudApproach.textContent = "Short Final 2 DME";
        else if (elapsedSec < 115) hudApproach.textContent = "Threshold Crossing";
        else if (elapsedSec < 170) hudApproach.textContent = "Touchdown / Rollout";
        else hudApproach.textContent = "Vacating Runway / Taxi";
      }

      if (currentPos) {
        const cartographic = Cesium.Cartographic.fromCartesian(currentPos);
        const lon = Cesium.Math.toDegrees(cartographic.longitude);
        const lat = Cesium.Math.toDegrees(cartographic.latitude);
        
        const altFt = Math.round((cartographic.height - visualGroundZ + ap.altMeters) * 3.28084);

        const thresholdCartesian = Cesium.Cartesian3.fromDegrees(ap.lon, ap.lat, visualGroundZ);
        const distMeters = Cesium.Cartesian3.distance(currentPos, thresholdCartesian);
        
        const thresholdDistNM = (elapsedSec > 115) ? -((distMeters / 1852).toFixed(2)) : (distMeters / 1852).toFixed(2);

        hudAlt.textContent = `${altFt.toLocaleString()} ft`;
        hudCoords.textContent = `${lat.toFixed(4)}°N, ${Math.abs(lon).toFixed(4)}°W`;
        hudCockpitAlt.textContent = `${altFt}`;
        hudDist.textContent = `${thresholdDistNM} NM`;

        const nextTime = Cesium.JulianDate.addSeconds(currentTime, 0.25, new Cesium.JulianDate());
        const nextPos = positionProperty.getValue(nextTime);

        if (nextPos) {
          Cesium.Cartesian3.subtract(nextPos, currentPos, scratchVelocity);
          const stepDistance = Cesium.Cartesian3.magnitude(scratchVelocity);
          
          if (stepDistance > 0.001) {
            Cesium.Cartesian3.normalize(scratchVelocity, scratchVelocity);
            Cesium.Cartesian3.clone(scratchVelocity, lastValidVelocity);
          } else {
            Cesium.Cartesian3.clone(lastValidVelocity, scratchVelocity);
          }

          let kts = Math.round((stepDistance / 0.25) * 1.94384);
          if (elapsedSec > 168 && kts < 5) kts = 0; 
          
          hudSpeed.textContent = `${kts} kts`;
          hudCockpitSpd.textContent = `${kts}`;

          const enuMatrix = Cesium.Transforms.eastNorthUpToFixedFrame(currentPos);
          const invEnu = Cesium.Matrix4.inverse(enuMatrix, new Cesium.Matrix4());
          const localVelocity = Cesium.Matrix4.multiplyByPointAsVector(invEnu, scratchVelocity, new Cesium.Cartesian3());
          let headingDeg = Cesium.Math.toDegrees(Math.atan2(localVelocity.x, localVelocity.y));
          if (headingDeg < 0) headingDeg += 360;
          hudCockpitHdg.textContent = `HDG: ${Math.round(headingDeg).toString().padStart(3, "0")}°`;

          engineFireSystem.show = false;
          engineSmokeSystem.show = false;
          cockpitSmokeSystem.show = false;
          gearSparkSystem.show = false;

          const rotMatrix = Cesium.Transforms.rotationMatrixFromPositionVelocity(
            currentPos,
            scratchVelocity,
            Cesium.Ellipsoid.WGS84
          );
          const modelMatrix = Cesium.Matrix4.fromRotationTranslation(rotMatrix, currentPos);

          if (activeEmergency === 'fire') {
            engineFireSystem.show = true;
            engineSmokeSystem.show = true;
            engineFireSystem.modelMatrix = modelMatrix;
            engineSmokeSystem.modelMatrix = modelMatrix;
            const trs = new Cesium.TranslationRotationScale();
            trs.translation = new Cesium.Cartesian3(4.5, -3.0, -0.5); 
            trs.rotation = Cesium.Quaternion.fromAxisAngle(Cesium.Cartesian3.UNIT_X, Cesium.Math.toRadians(-90));
            const emitterModelMatrix = Cesium.Matrix4.fromTranslationRotationScale(trs);
            engineFireSystem.emitterModelMatrix = emitterModelMatrix;
            engineSmokeSystem.emitterModelMatrix = emitterModelMatrix;
          }

          if (activeEmergency === 'fumes') {
            cockpitSmokeSystem.show = true;
            cockpitSmokeSystem.modelMatrix = modelMatrix;
            const trs = new Cesium.TranslationRotationScale();
            trs.translation = new Cesium.Cartesian3(10.0, 0.0, 1.0);
            cockpitSmokeSystem.emitterModelMatrix = Cesium.Matrix4.fromTranslationRotationScale(trs);
          }

          if (activeEmergency === 'gear' && elapsedSec >= 120 && kts > 10) {
            gearSparkSystem.show = true;
            gearSparkSystem.modelMatrix = modelMatrix;
            const trs = new Cesium.TranslationRotationScale();
            trs.translation = new Cesium.Cartesian3(12.0, 0.0, -2.5);
            trs.rotation = Cesium.Quaternion.fromAxisAngle(Cesium.Cartesian3.UNIT_Y, Cesium.Math.toRadians(-30));
            gearSparkSystem.emitterModelMatrix = Cesium.Matrix4.fromTranslationRotationScale(trs);
          }

          if (cameraMode === "cockpit") {
            Cesium.Matrix4.fromRotationTranslation(rotMatrix, currentPos, scratchTransform);
            Cesium.Matrix4.multiplyByTranslation(
              scratchTransform,
              externalNoseOffset,
              mountTransform
            );
            viewer.camera.lookAtTransform(
              mountTransform,
              new Cesium.HeadingPitchRange(
                Cesium.Math.toRadians(90),
                Cesium.Math.toRadians(-2.5), 
                0.1
              )
            );
          }
        }
      }
    });
  </script>
</body>
</html>
